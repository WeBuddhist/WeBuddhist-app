name: 🍎 Build & Distribute iOS

# Reusable workflow. Called by release-prod.yml.
# Builds a signed IPA of org.pecha.app (flavor prod) for one server and
# (optionally) uploads it to App Store Connect, where it shows up in TestFlight.
# Every build is the same app; the server is picked by the entry file
# lib/main_<server>.dart (see ci/scripts/create_env_files.sh). Submitting a
# release for App Store review is a separate job in release-prod.yml.
#
# Signing model: distribution certificate imported from a base64 secret, the
# prod provisioning profiles installed from base64 secrets, and the Xcode
# project switched to manual signing for the build. Two profiles are needed —
# one for Runner (org.pecha.app) and one for the TimerWidget extension
# (org.pecha.app.TimerWidget). The "Generate Entitlements" build phase in the
# Runner target reads AUTH0_DOMAIN + AIRBRIDGE_APP_NAME from the environment, so
# both are exported before the build.

on:
  workflow_call:
    inputs:
      server:          { required: true,  type: string }   # dev | staging (= testing) | prod
      ref:             { required: true,  type: string }   # commit to build
      version_name:    { required: true,  type: string }   # X.Y.Z
      build_number:    { required: true,  type: string }   # monotonic, shared with Android
      upload_to_store: { required: false, type: boolean, default: true }
      environment:     { required: false, type: string,  default: '' }

permissions:
  contents: read

env:
  FLAVOR: prod
  BUNDLE_ID: org.pecha.app
  AIRBRIDGE_APP_NAME: webuddhist
  # Auth0 leftover: the app signs in with Firebase, but the "Generate
  # Entitlements" build phase still stops the build without it. Remove both
  # together.
  AUTH0_DOMAIN: we-buddhist-prod.us.auth0.com

jobs:
  ios:
    name: iOS • ${{ inputs.server }}
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    timeout-minutes: 75
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: 🛠️ Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: 📦 Enable Swift Package Manager
        run: |
          # The Xcode project is integrated with Flutter's SwiftPM support:
          # plugins come through FlutterGeneratedPluginSwiftPackage and the
          # committed Podfile.lock only lists pods SwiftPM cannot provide.
          # Building with this off re-adds every Firebase pod and rewrites
          # Podfile.lock, so it must match the developer setting.
          flutter config --enable-swift-package-manager

      - name: 📝 Create .env file (${{ inputs.server }} server)
        env:
          LIBRARY_API_KEY:               ${{ secrets.LIBRARY_API_KEY }}
          LIBRARY_CHANTS_TAG_ID:         ${{ secrets.LIBRARY_CHANTS_TAG_ID }}
          AUTH0_AUDIENCE:                ${{ secrets.AUTH0_AUDIENCE }}
          POSTHOG_API_KEY:               ${{ secrets.POSTHOG_API_KEY }}
          STAGING_LIBRARY_API_KEY:       ${{ secrets.STAGING_LIBRARY_API_KEY }}
          STAGING_LIBRARY_CHANTS_TAG_ID: ${{ secrets.STAGING_LIBRARY_CHANTS_TAG_ID }}
          STAGING_POSTHOG_API_KEY:       ${{ secrets.STAGING_POSTHOG_API_KEY }}
          DEV_LIBRARY_API_KEY:           ${{ secrets.DEV_LIBRARY_API_KEY }}
          DEV_LIBRARY_CHANTS_TAG_ID:     ${{ secrets.DEV_LIBRARY_CHANTS_TAG_ID }}
          DEV_POSTHOG_API_KEY:           ${{ secrets.DEV_POSTHOG_API_KEY }}
          LOCATIONIQ_TOKEN:              ${{ secrets.LOCATIONIQ_TOKEN }}
        run: bash ci/scripts/create_env_files.sh "${{ inputs.server }}"

      - name: 🔐 Create ios/Flutter/Secrets.xcconfig (Airbridge)
        env:
          AIRBRIDGE_SDK_TOKEN: ${{ secrets.AIRBRIDGE_SDK_TOKEN }}
        run: bash ios/scripts/prepare_ci_secrets.sh

      - name: 🔥 Inject GoogleService-Info.plist (only if provided)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Injected ios/Runner/GoogleService-Info.plist from secret"
          else
            echo "No secret — assuming GoogleService-Info.plist is committed"
          fi

      - name: 📦 flutter pub get
        run: flutter pub get

      - name: 🍫 CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: 🔑 Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          p12-password:    ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: 📄 Install provisioning profiles (app + TimerWidget)
        id: profile
        env:
          APP_B64:    ${{ secrets.IOS_PROVISION_PROFILE_PROD_BASE64 }}
          WIDGET_B64: ${{ secrets.IOS_PROVISION_PROFILE_PROD_WIDGET_BASE64 }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local b64="$1" key="$2" plist uuid name
            if [ -z "$b64" ]; then
              echo "::error::No '$key' provisioning profile secret for $BUNDLE_ID"; exit 1
            fi
            echo "$b64" | base64 --decode > "$RUNNER_TEMP/$key.mobileprovision"
            plist=$(security cms -D -i "$RUNNER_TEMP/$key.mobileprovision")
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$plist")
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$plist")
            cp "$RUNNER_TEMP/$key.mobileprovision" "$PROFILES_DIR/$uuid.mobileprovision"
            echo "${key}_profile_name=$name" >> "$GITHUB_OUTPUT"
            echo "Installed $key profile '$name' ($uuid)"
          }

          install_profile "$APP_B64"    app
          install_profile "$WIDGET_B64" widget

      - name: ✍️ Switch project to manual signing
        run: |
          set -euo pipefail
          # Runner and the TimerWidget extension are separate signable targets with
          # distinct bundle IDs, so each needs its own profile. Leaving the widget on
          # automatic signing makes the archive fail with "No Accounts" on the runner.
          for spec in "Runner:${{ steps.profile.outputs.app_profile_name }}" \
                      "TimerWidget:${{ steps.profile.outputs.widget_profile_name }}"; do
            fastlane run update_code_signing_settings \
              use_automatic_signing:false \
              path:"ios/Runner.xcodeproj" \
              team_id:"${{ secrets.IOS_TEAM_ID }}" \
              code_sign_identity:"Apple Distribution" \
              profile_name:"${spec#*:}" \
              targets:"${spec%%:*}"
          done

      - name: 🧾 Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${{ env.BUNDLE_ID }}</key>
              <string>${{ steps.profile.outputs.app_profile_name }}</string>
              <key>${{ env.BUNDLE_ID }}.TimerWidget</key>
              <string>${{ steps.profile.outputs.widget_profile_name }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: 🚫 Neutralize Crashlytics symbol-upload build phase (CI archive)
        run: |
          # Firebase is integrated via Swift Package Manager (not the Podfile),
          # so the "FlutterFire: flutterfire upload-crashlytics-symbols" Xcode
          # run-script phase resolves the Crashlytics `run` helper to an SPM
          # checkout path that doesn't exist at archive time. flutterfire then
          # aborts with "ProcessException: No such file or directory" and fails
          # the whole archive even though the app compiled. Symbol upload is
          # post-build telemetry and must not block a release, so swap that
          # phase's script for a no-op during the CI archive (dSYMs are still
          # produced and shipped in the IPA / build artifact).
          PBXPROJ=ios/Runner.xcodeproj/project.pbxproj
          perl -i -pe 's/shellScript = ".*";/shellScript = "echo CI Crashlytics upload-symbols phase disabled; exit 0";/ if /upload-crashlytics-symbols/' "$PBXPROJ"
          if grep -q -- '--upload-symbols-script-path' "$PBXPROJ"; then
            echo "::warning::Could not patch the Crashlytics build phase; relying on the absent flutterfire CLI to make it skip."
          else
            echo "Crashlytics symbol-upload build phase neutralized for the CI archive."
          fi

      # A flavor xcconfig that sets FLUTTER_TARGET overrides the `-t` below
      # in release builds (Xcode compiles the Dart itself), so the app would
      # run another lib/main_*.dart and load another server's .env file.
      - name: 🎯 Check no iOS flavor pins the entry file
        run: |
          # Any form Xcode accepts: spaces around =, indentation, [sdk=...] conditions.
          if grep -nE '^[[:space:]]*FLUTTER_TARGET[[:space:]]*(\[[^]]*\])?[[:space:]]*=' ios/Flutter/*-debug.xcconfig ios/Flutter/*-release.xcconfig; then
            echo "::error::An iOS flavor xcconfig sets FLUTTER_TARGET; remove it so -t decides the entry file."
            exit 1
          fi

      - name: 🏗️ Build IPA (${{ inputs.server }} server)
        env:
          AIRBRIDGE_SDK_TOKEN: ${{ secrets.AIRBRIDGE_SDK_TOKEN }}
          SERVER:              ${{ inputs.server }}
          VERSION_NAME:        ${{ inputs.version_name }}
          BUILD_NUMBER:        ${{ inputs.build_number }}
        run: |
          echo "Building $BUNDLE_ID $VERSION_NAME (+$BUILD_NUMBER) for the $SERVER server"
          flutter build ipa --release \
            --flavor "$FLAVOR" -t "lib/main_${SERVER}.dart" \
            --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      # Generated.xcconfig only holds what -t asked for; a flavor xcconfig
      # loaded after it could still override it. Ask Xcode for the value it
      # resolved for the Runner target, which is what the release build used.
      - name: 🎯 Check the entry file Xcode built
        env:
          SERVER: ${{ inputs.server }}
        run: |
          set -euo pipefail
          CONFIG="$(printf '%s' "${FLAVOR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOR:1}-Release"
          BUILT=$(xcodebuild -showBuildSettings -workspace ios/Runner.xcworkspace \
              -scheme "$FLAVOR" -configuration "$CONFIG" -disableAutomaticPackageResolution 2>/dev/null \
            | awk '/Build settings for action .* and target Runner:/{r=1} r && $1=="FLUTTER_TARGET"{print $3; exit}')
          echo "Xcode FLUTTER_TARGET for Runner ($CONFIG): ${BUILT:-<none>}"
          case "$BUILT" in
            */lib/main_${SERVER}.dart|lib/main_${SERVER}.dart) ;;
            *) echo "::error::Xcode built ${BUILT:-nothing}, expected lib/main_${SERVER}.dart"; exit 1 ;;
          esac

      - name: ⬆️ Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.server }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: 💾 Keep dSYMs as a build artifact
        if: ${{ inputs.upload_to_store }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.server }}-dSYMs
          path: build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 90

      - name: 🔥 Upload Crashlytics dSYMs
        if: ${{ inputs.upload_to_store }}
        run: |
          # The in-Xcode "upload-crashlytics-symbols" build phase is guarded to
          # never fail the archive; we upload dSYMs deliberately here.
          # Firebase comes in through Swift Package Manager, so upload-symbols
          # lives in Xcode's SwiftPM checkout under DerivedData, not in Pods.
          # The Pods path is kept as a fallback for a CocoaPods-only build.
          UPLOAD=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols' \
            -type f 2>/dev/null | head -n 1)
          [ -n "$UPLOAD" ] || UPLOAD=ios/Pods/FirebaseCrashlytics/upload-symbols
          GSP=ios/Runner/GoogleService-Info.plist
          # Upload every dSYM in the archive (Runner, App/Flutter frameworks,
          # TimerWidget, embedded frameworks). Crashlytics needs all of them
          # to symbolicate a crash, not just Runner.app.dSYM.
          DSYMS=build/ios/archive/Runner.xcarchive/dSYMs
          if [ -x "$UPLOAD" ] && [ -f "$GSP" ] && [ -d "$DSYMS" ]; then
            echo "Uploading dSYMs:"; ls -1 "$DSYMS"
            "$UPLOAD" -gsp "$GSP" -p ios "$DSYMS"
          else
            echo "::warning::Skipping dSYM upload (upload-symbols=$UPLOAD gsp=$GSP dsyms=$DSYMS)"
          fi

      - name: 🛫 Upload to App Store Connect (shows in TestFlight)
        if: ${{ inputs.upload_to_store }}
        env:
          ASC_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY:       ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          KEY_B64=$(printf '%s' "$ASC_KEY" | base64 | tr -d '\n')
          cat > "$RUNNER_TEMP/asc_api_key.json" <<EOF
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": "$KEY_B64",
            "is_key_content_base64": true,
            "in_house": false
          }
          EOF
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "Uploading $IPA to TestFlight"
          fastlane run upload_to_testflight \
            api_key_path:"$RUNNER_TEMP/asc_api_key.json" \
            ipa:"$IPA" \
            skip_waiting_for_build_processing:true
