name: 🤖 Build & Distribute Android

# Reusable workflow. Called by release-prod.yml.
# Builds a signed AAB of org.pecha.app (flavor prod) for one server and
# (optionally) uploads it to the given Google Play track. Every build is the
# same app; the server is picked by the entry file lib/main_<server>.dart
# (see ci/scripts/create_env_files.sh). Android signing reuses the CM_* env vars
# that android/app/build.gradle.kts already reads in CI mode.

on:
  workflow_call:
    inputs:
      server:          { required: true,  type: string }   # dev | staging (= testing) | prod
      ref:             { required: true,  type: string }   # commit to build
      version_name:    { required: true,  type: string }   # X.Y.Z
      build_number:    { required: true,  type: string }   # monotonic, shared with iOS
      play_track:      { required: true,  type: string }   # internal | production
      upload_to_store: { required: false, type: boolean, default: true }
      release_notes:   { required: false, type: string,  default: '' }   # Play "What's new"
      environment:     { required: false, type: string,  default: '' }

permissions:
  contents: read

env:
  FLAVOR: prod
  PACKAGE_NAME: org.pecha.app

jobs:
  android:
    name: Android • ${{ inputs.server }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches the Gradle distribution and dependency caches between runs, so
      # a release does not depend on downloading Gradle from GitHub each time.
      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: 📝 Create .env file (${{ inputs.server }} server)
        env:
          LIBRARY_API_KEY:               ${{ secrets.LIBRARY_API_KEY }}
          LIBRARY_CHANTS_TAG_ID:         ${{ secrets.LIBRARY_CHANTS_TAG_ID }}
          AUTH0_AUDIENCE:                ${{ secrets.AUTH0_AUDIENCE }}
          POSTHOG_API_KEY:               ${{ secrets.POSTHOG_API_KEY }}
          STAGING_LIBRARY_API_KEY:       ${{ secrets.STAGING_LIBRARY_API_KEY }}
          STAGING_LIBRARY_CHANTS_TAG_ID: ${{ secrets.STAGING_LIBRARY_CHANTS_TAG_ID }}
          STAGING_POSTHOG_API_KEY:       ${{ secrets.STAGING_POSTHOG_API_KEY }}
          DEV_LIBRARY_API_KEY:           ${{ secrets.DEV_LIBRARY_API_KEY }}
          DEV_LIBRARY_CHANTS_TAG_ID:     ${{ secrets.DEV_LIBRARY_CHANTS_TAG_ID }}
          DEV_POSTHOG_API_KEY:           ${{ secrets.DEV_POSTHOG_API_KEY }}
          LOCATIONIQ_TOKEN:              ${{ secrets.LOCATIONIQ_TOKEN }}
        run: bash ci/scripts/create_env_files.sh "${{ inputs.server }}"

      - name: 🔥 Inject google-services.json (only if provided)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Injected android/app/google-services.json from secret"
          else
            echo "No GOOGLE_SERVICES_JSON_BASE64 secret — assuming the file is committed"
          fi

      - name: 🔐 Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — release build cannot be signed."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          # build.gradle.kts treats a non-blank CM_KEYSTORE_PATH as "CI mode".
          echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: 📦 flutter pub get
        run: flutter pub get

      - name: 🏗️ Build App Bundle (${{ inputs.server }} server)
        env:
          AIRBRIDGE_APP_NAME:   webuddhist
          AIRBRIDGE_SDK_TOKEN:  ${{ secrets.AIRBRIDGE_SDK_TOKEN }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
          CM_KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVER:               ${{ inputs.server }}
          VERSION_NAME:         ${{ inputs.version_name }}
          BUILD_NUMBER:         ${{ inputs.build_number }}
        run: |
          echo "Building $PACKAGE_NAME $VERSION_NAME (+$BUILD_NUMBER) for the $SERVER server"
          flutter build appbundle --release \
            --flavor "$FLAVOR" -t "lib/main_${SERVER}.dart" \
            --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"

      - name: ⬆️ Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.server }}
          path: |
            build/app/outputs/bundle/${{ env.FLAVOR }}Release/*.aab
            build/app/outputs/mapping/${{ env.FLAVOR }}Release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: 📝 Write Play release notes
        if: ${{ inputs.upload_to_store && inputs.release_notes != '' }}
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          echo "WHATSNEW_DIR=$RUNNER_TEMP/whatsnew" >> "$GITHUB_ENV"

      - name: 🚀 Upload to Google Play (${{ inputs.play_track }})
        if: ${{ inputs.upload_to_store }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/${{ env.FLAVOR }}Release/*.aab
          track: ${{ inputs.play_track }}
          status: completed
          mappingFile: build/app/outputs/mapping/${{ env.FLAVOR }}Release/mapping.txt
          whatsNewDirectory: ${{ env.WHATSNEW_DIR }}
